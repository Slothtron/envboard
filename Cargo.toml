# envboard —— 多语言仓库的 workspace 根。
#
# Rust 布局：workspace 根在包根，成员在 `crates/`（产品 crate）与
# `tests/`（纯测试 crate）。`cargo test` 在本目录即可跑全量。
#
# 成员用 glob，加 crate 不需要改这里。
[workspace]
resolver = "3"
members = ["crates/*", "tests/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
# 内部 crate：只写 path，避免版本漂移
envboard-admin = { path = "crates/admin" }
envboard-desktop = { path = "crates/desktop" }
envboard-engine = { path = "crates/engine" }
envboard-events = { path = "crates/events" }
envboard-engine-fake = { path = "crates/engine-fake" }
envboard-host = { path = "crates/host" }
envboard-manager = { path = "crates/manager" }
envboard-protocol = { path = "crates/protocol" }

# 外部依赖：版本写在这里，成员一律 `workspace = true`。
#
# 两条纪律：
#   1. `Cargo.lock` 必须入库，`cargo build --offline` 是验收项 —— 依赖要克制；
#   2. **本仓只有一个可执行形态**：桌面 GUI。`gpui-kit` 是它唯一的界面框架，且只允许
#      出现在 `crates/desktop`（`deps` 门禁第 11 条在 manifest 产物依赖面上判）。
#      旧版纪律写的是「CLI 之外不引大框架」，那是 web 形态还在时的口径；web 形态
#      （HTTP+SSE 宿主 + 内嵌 SPA）整体下线后，"另一个形态"没有了，理由随之改写 ——
#      取舍与代价见 docs/adr-001-gpui-desktop-form.md 与 docs/adr-003-retire-web-frontend.md。
#      曾经为它服务的传输面依赖（axum / tokio-stream / futures-util / include_dir /
#      qrcode）一并出库，`toolchain` 门禁继续把 Node/TS 面挡在仓库之外。
gpui-kit = "0.8"
# 0.8 锁 gpui-pre 0.3.9 + gpui-component 0.8.0 + gpui-base 0.8.0 + kit-assets。
# 全 workspace 只许这一份 gpui：出现两份就是两套类型系统（Entity 按 TypeId 寻址）。
async-trait = "0.1.92"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# 成员可以再追加 features（如 envboard-engine 给 rustls 追加 ring/std）。
clap = { version = "4.6.6", features = ["derive"] }
# 只被工程门禁用来解析各 crate 的 Cargo.toml（依赖方向、发布标识）；产品代码不用它。
toml = "1.1.4"

# 引擎（envboard-engine）的 TLS 栈：rustls 用 ring provider（不用 aws-lc-rs，
# 避免 C 构建链），rcgen 只做签发（其 ring 后端不支持生成 RSA 密钥，因此新生成的 CA
# 用 ECDSA P-256，加载既有 RSA CA 不受影响）。
# x509-parser 与 time 是 rcgen 的**同版本可选传递依赖**，被本仓直接 used 的两条：
# 公钥配对校验要读证书 SPKI、证书有效期要设时间戳 —— 版本必须与 rcgen 内部一致。
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
# x509-parser 不作直接依赖：证书结构的读取由 envboard-engine 的 der 模块自己做
# （固定形状、可单测），它只是 rcgen 的可选传递依赖随 feature 进入。
time = { version = "0.3", default-features = false, features = ["std"] }
# 热更新单快照：数据面每请求 load_full，装配即整体换入，无文件通道、无轮询。
arc-swap = "1.9.2"

# GPUI 的即时模式渲染在未优化时慢到不可用（dipswitch 实测），所以框架包必须有优化。
# **逐包点名**，两处偏离本地先例 dipswitch（它是纯 GUI 产物，用了
# `[profile.dev] opt-level = 1` + `[profile.dev.package."*"] opt-level = 3`）：
#   - 不用通配：那会把引擎的 rustls / rcgen / tokio 全抬到 O3，而本仓的日常是跑
#     引擎与管理器的测试，与界面无关的编译成本不该由界面框架付；
#   - 不动 `[profile.dev]`：本仓成员代码不是渲染瓶颈（瓶颈在框架包，已单独优化）。
# 若 P0.3 之后界面在 dev 下确实迟钝，再回来加全局 opt-level（一次改动，可实测比较）。
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.gpui-base]
opt-level = 3

[profile.dev.package.gpui-kit]
opt-level = 3

[profile.release]
# 单机工具，体积与启动速度优先于极致优化
lto = "thin"
strip = true
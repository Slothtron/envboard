# envboard —— Rust workspace 根。
#
# 分层即架构，crates/ 按依赖方向分四层，层内平铺：
#   core/     领域内核：protocol、events（叶子词汇）+ engine（规则/领域/代理引擎）
#             + engine-fake（引擎测试替身）
#   service/  编排与组合根：manager（环境生命周期）→ admin（传输无关门面）
#             → host（唯一组合根，引擎装配只住这里）
#   ui/       设计系统：24 个颜色角色、度量、字号、8 个原语 + 主题 JSON
#             （**不依赖任何业务 crate**，由 Cargo.toml 保证，见 ADR-1）
#   app/      交付形态：nsh（NSH 0.6.1 原生壳，唯一发布物；进程内直调门面）
# 依赖方向单向：protocol/events ← engine ← manager ← admin ← host ← nsh；
# ui 是叶子，app/nsh ← ui（ui 不许反向依赖，也不许依赖 admin/manager）。
# tests/ 是纯测试 crate（contract-tests 消费 fixtures 的可执行契约）。
#
# 成员用 glob，层内加 crate 不需要改这里；`crates/ui` 不在任何 glob 内，显式列出。
[workspace]
resolver = "3"
members = ["crates/core/*", "crates/service/*", "crates/app/*", "crates/ui", "tests/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
# 内部 crate：只写 path，避免版本漂移
envboard-admin = { path = "crates/service/admin" }
envboard-engine = { path = "crates/core/engine" }
envboard-events = { path = "crates/core/events" }
envboard-engine-fake = { path = "crates/core/engine-fake" }
envboard-host = { path = "crates/service/host" }
envboard-manager = { path = "crates/service/manager" }
envboard-protocol = { path = "crates/core/protocol" }
envboard-ui = { path = "crates/ui" }

# NSH 0.6.1：Windows 侧 Mica + windowless RichEdit（IME 组词画在框内）都自带，
# 不引 webview。版本必须钉死：0.x 的小版本签过破坏性变更（事件枚举、
# `MainWindowOptions` 的 `#[non_exhaustive]` 字段）。
nsh-base = "=0.6.1"
nsh-core = "=0.6.1"

# 外部依赖：版本写在这里，成员一律 `workspace = true`。
#
# 两条纪律：
#   1. `Cargo.lock` 必须入库，`cargo build --offline` 是验收项 —— 依赖要克制；
#   2. **本仓只有一个可执行形态**：NSH 原生桌面（`crates/app/nsh`）。
#      数据面进程内直调门面，不起监听端口、不带 webview。
#      web 控制台（axum/HTTP/SSE）、GPUI 桌面与 Tauri 壳均已退场（git 历史可查）。
async-trait = "0.1.92"
# HTTP 请求目标解析（抓包记录拆 path/query）：Uri 原生支持 origin-form 与 absolute-form，
# 比手写 split_once('?') 稳；本地两套 registry 源缓存均已暖，离线可解析。
http = "1.5.0"
libc = "0.2.189"
# `rc`：抓包记录在进程内以 `Arc<Record>` 共享（S1），serde 需要 Arc 的实现；
# 只影响派生 impl 的可见性，不改任何 wire 形状。
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# 成员可以再追加 features（如 envboard-engine 给 rustls 追加 ring/std）。
# 启动方式（状态目录 / 端口区间）走环境变量与便携标记，经 `HostOptions` 入参；
# 本仓没有命令行解析库（clap 随 Tauri 壳退场）。

# 引擎（envboard-engine）的 TLS 栈：rustls 用 ring provider（不用 aws-lc-rs，
# 避免 C 构建链），rcgen 只做签发（其 ring 后端不支持生成 RSA 密钥，因此新生成的 CA
# 用 ECDSA P-256，加载既有 RSA CA 不受影响）。
# x509-parser 与 time 是 rcgen 的**同版本可选传递依赖**，被本仓直接 used 的两条：
# 公钥配对校验要读证书 SPKI、证书有效期要设时间戳 —— 版本必须与 rcgen 内部一致。
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
# 上游严格档走平台校验器（ADR-008）：Windows Schannel 完整口径（用户+本机 ROOT、
# AIA 补链、动态根）。rustls-native-certs 的 Windows 实现只读当前用户 ROOT，
# 公共根多在本机 ROOT → 系统口径成功的域名报 UnknownIssuer，故换装。
rustls-platform-verifier = "0.7.1"
rustls-pemfile = "2.2.0"
# x509-parser 不作直接依赖：证书结构的读取由 envboard-engine 的 der 模块自己做
# （固定形状、可单测），它只是 rcgen 的可选传递依赖随 feature 进入。
time = { version = "0.3", default-features = false, features = ["std"] }
# 热更新单快照：数据面每请求 load_full，装配即整体换入，无文件通道、无轮询。
arc-swap = "1.9.2"
# 账本存储（ADR-007）：bundled 静态链接 sqlite，目标机不需要系统 sqlite；
# 离线缓存已暖（rusqlite 0.40.2 / libsqlite3-sys 0.38.2 / cc）。
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
# 单机工具，体积与启动速度优先于极致优化
lto = "thin"
strip = true
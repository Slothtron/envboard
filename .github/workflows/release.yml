name: release

# 单一渠道：`vX.Y.Z` 标签 → 免安装 exe（`envboard.exe`）+ 便携包 zip。
# NSH 原生壳没有 Tauri 时代的形态标签隔离（ADR-014 随壳退场），**预览渠道暂停**：
# 版本号带预发布段（`-preview.N` 等）直接失败，避免预览二进制与正式版共用账本。
# 触发：推 `v*` 标签，或手动 workflow_dispatch（只出构建产物，不建 Release）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # cosign keyless 签名（Fulcio 短期证书 + Rekor 透明日志）需要 OIDC token。
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号是唯一真源：tag 与 Cargo.toml 都从它推。
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "版本号 $version 带预发布段：NSH 形态暂无预览身份隔离，预览渠道暂停（见 docs/building.md）" >&2
            exit 1
          fi

      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "v$VERSION" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} != v$VERSION（版本号与 tag 必须一致）" >&2
            exit 1
          }

      # 与 rust-toolchain.toml 钉死的版本一致。
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2

      # 唯一发布物：NSH 壳（默认特征，harness 探针不进发布构建）。
      - name: Build NSH release
        run: cargo build -p envboard-nsh --release --locked

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # 发布名是产品身份 envboard.exe；crate 二进制名 envboard-nsh 只是构建产物名。
          cp target/release/envboard-nsh.exe dist/envboard.exe

          # 便携版不是另一种编译产物，而是「同一个 exe + 同目录的 envboard.portable
          # 标记」：标记决定数据落在 exe 旁的 envboard-data。裸 exe 不带标记，
          # 数据在 %LOCALAPPDATA%\envboard，所以便携形态必须单独打包。
          mkdir -p dist/portable
          cp dist/envboard.exe dist/portable/
          printf '%s\n' \
            'envboard 便携标记（不要删除本文件）' \
            '数据目录：本目录下的 envboard-data/' \
            '删除本文件即回到平台默认目录；详见 docs/usage.md「便携形态」。' \
            > dist/portable/envboard.portable
          powershell -NoProfile -Command "Compress-Archive -Path dist/portable/* -DestinationPath dist/envboard-portable.zip -Force"
          rm -rf dist/portable
          ls -lh dist
          powershell -NoProfile -Command "Add-Type -AssemblyName System.IO.Compression.FileSystem; [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/envboard-portable.zip')).Entries | ForEach-Object { \$_.FullName }"

      # 完整性 + 供应链可审计（SOP §5）：SHA256SUMS 覆盖全部产物，cosign keyless
      # 逐个签名（含 SHA256SUMS 本身）。.sigstore 随 dist/* 进 artifact 与 Release。
      # 注意：cosign ≠ Authenticode，不消除 SmartScreen，只证明「产物来自本仓库本次构建」。
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        shell: bash
        run: |
          cd dist
          for f in *.exe *.zip SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: envboard-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Windows x64 构建（只支持 Windows）。NSH 原生壳，**不需要 WebView2**。

            - `envboard.exe`：单文件免安装，双击即用。数据在 `%LOCALAPPDATA%\envboard`
              （与旧 Tauri 版同一份账本，升级即迁移；两版不要同时运行）。
            - `envboard-portable.zip`：便携包（`envboard.exe` + `envboard.portable` 标记），
              解压即用，数据落在解压目录的 `envboard-data\`，可与正式版同时运行。

            未做 Authenticode 签名：首次运行仍会撞 SmartScreen，点「更多信息 → 仍要运行」。
            产物附 SHA256SUMS 校验和与 cosign keyless 签名（`.sigstore`），可验证完整性与来源：
            `sha256sum -c SHA256SUMS`；`cosign verify-blob --bundle <产物>.sigstore <产物>`。
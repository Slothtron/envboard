[package]
name = "envboard-core-fake"
description = "envboard v3 ProxyEngine 的测试替身：真绑定端口、报告可注入，不代理任何流量"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 本仓不发布 crate：发布物是 `envboard` 二进制。
# 显式声明（而不是靠"没写 publish"）让"不发布"成为 manifest 事实。
publish = false

[dependencies]
async-trait.workspace = true
envboard-core-api.workspace = true
serde_json.workspace = true
tokio = { workspace = true }

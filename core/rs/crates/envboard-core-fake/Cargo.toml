[package]
name = "envboard-core-fake"
description = "envboard 的测试替身 core：只监听端口、回写状态文件，不改写任何流量"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 本仓不发布 crate：发布物是 `envboard` 二进制。
# 显式声明（而不是靠"没写 publish"）让"不发布"成为 manifest 事实。
publish = false

[dependencies]
async-trait.workspace = true
envboard-core-api.workspace = true
envboard-rules.workspace = true
serde_json.workspace = true
tokio = { workspace = true }

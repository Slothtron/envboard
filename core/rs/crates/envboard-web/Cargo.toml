[package]
name = "envboard-web"
description = "envboard 工作台：本地 HTTP API + 内嵌前端（零前端构建、零 CDN）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 本仓不发布 crate：发布物是 `envboard` 二进制。
# 显式声明（而不是靠"没写 publish"）让"不发布"成为 manifest 事实。
publish = false

[dependencies]
envboard-core-api.workspace = true
envboard-domain.workspace = true
envboard-manager.workspace = true
axum = { workspace = true, features = ["json", "query"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time", "sync", "macros"] }
tokio-stream.workspace = true

[dev-dependencies]
envboard-core-fake.workspace = true

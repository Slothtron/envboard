[package]
name = "envboard-core-mitmproxy"
description = "ProxyCore 的 mitmproxy 实现：编排 mitmdump 实例、预物化共享 CA、物化注入器"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 本仓不发布 crate：发布物是 `envboard` 二进制。
# 显式声明（而不是靠"没写 publish"）让"不发布"成为 manifest 事实。
publish = false

[dependencies]
envboard-core-api.workspace = true
async-trait.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "rt", "time", "sync", "io-util"] }

[dev-dependencies]
envboard-domain.workspace = true
envboard-manager.workspace = true
envboard-rules.workspace = true

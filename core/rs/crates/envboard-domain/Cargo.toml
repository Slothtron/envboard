[package]
name = "envboard-domain"
description = "envboard 的领域模型（纯逻辑）：环境校验/合并、端口选择、reconcile 决策"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 本仓不发布 crate：发布物是 `envboard` 二进制。
# 显式声明（而不是靠"没写 publish"）让"不发布"成为 manifest 事实。
publish = false

[dependencies]
envboard-core-api.workspace = true
# host 归一化/校验的唯一实现在 rules crate（环境层用它校验 insecure_hosts 条目，
# 不复制一份 label 规则）。两边都是纯逻辑，方向也不会成环。
envboard-rules.workspace = true
serde.workspace = true
serde_json.workspace = true

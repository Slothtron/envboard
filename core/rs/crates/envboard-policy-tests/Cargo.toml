[package]
name = "envboard-policy-tests"
description = "工程门禁：仓库纪律的机械判定（只有测试目标）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 本仓不发布 crate：发布物是 `envboard` 二进制。
# 显式声明（而不是靠"没写 publish"）让"不发布"成为 manifest 事实。
publish = false

# 这是一个**只有测试目标**的 crate：它的产物就是 `cargo test` 的断言。
# 一门禁一文件（`tests/<gate>.rs`），可以单独跑，例如
# `cargo test -p envboard-policy-tests --test toolchain`。
#
# 为什么门禁写成 Rust 测试而不是脚本：门禁必须与产品同一条工具链、同一个类型
# 系统，否则就是"用另一套语言维护这个仓库的工程纪律"（见 README.md 的
# 「工具链纪律」）。需要已构建二进制的门禁不放在这里 —— 用 `CARGO_BIN_EXE_<bin>`
# 的门禁要跟它所属的包放在一起。
[dependencies]

[dev-dependencies]
# 门禁要解析各 crate 的 Cargo.toml（依赖方向、发布标识）。`std` 没有 TOML 解析，
# 所以这是本 crate 唯一的依赖，且只被测试用。
toml.workspace = true

[package]
name = "envboard-web"
description = "envboard 工作台的 web 形态：本地 HTTP API + 内嵌前端（零前端构建、零 CDN）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 本仓不发布 crate：发布物是 `envboard` 二进制。
publish = false

[dependencies]
envboard-engine.workspace = true
envboard-events.workspace = true
envboard-manager.workspace = true
envboard-protocol.workspace = true
axum = { workspace = true, features = ["json", "query"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "time", "sync", "macros"] }
tokio-stream.workspace = true
qrcode.workspace = true

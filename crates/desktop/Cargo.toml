[package]
name = "envboard-desktop"
description = "envboard 的桌面形态：GPUI 工作台，进程内直连 Admin 门面（不起 HTTP 服务）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 本仓不发布 crate：发布物是 GUI 二进制。
publish = false

# 二进制名沿用 web 形态下线前的 `envboard`：它是现在**唯一**的发布物
# （旧宿主 crates/server 已出库，见 docs/adr-003-retire-web-frontend.md）。
[[bin]]
name = "envboard"
path = "src/main.rs"

[dependencies]
# 唯一 GUI 框架：gpui-kit = gpui + gpui-component + gpui-base + 默认图标资产。
# 全 workspace 只允许这一个版本（两份 gpui 就是两套类型系统）。
gpui-kit.workspace = true
# 组合根（引擎装配与宿主编排都在那里）；本 crate 拿不到管理器类型。
envboard-host.workspace = true
# 管理门面：视图只通过它取数与下命令（显式声明这条边，门禁才认得出本 crate 是
# "门面消费方"，见 tests/policy-tests/tests/deps.rs 的装配盲区判据）。
envboard-admin.workspace = true
# 只取词汇：视图 DTO 与共享错误码。
envboard-protocol.workspace = true
envboard-engine.workspace = true
# 跨界通道要 tokio 的原语（oneshot / mpsc / interval），不要它的宏。
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
# 写操作的请求体是 JSON 形状（与 admin-api 的类型化 DTO 同一份），界面不拼领域对象。
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
envboard-engine-fake.workspace = true
# 无头 UI 集成测试：只给 gpui-pre 与 gpui-pre-platform 开 test-support，
# 不经过 gpui-kit 的同名开关（后者的 feature 会牵出 gpui-fast-platform，
# 它钉死 cocoa =0.26.0，与 gpui-pre-macos 已锁的 0.26.1 冲突，整棵依赖图解析不出来）。
gpui-pre = { version = "0.3.9", features = ["test-support"] }
# 单独加这一条是必须的：gpui-pre 的 test-support 不转发给平台层，
# 而 WindowsWindow::render_to_image 挂在 gpui_windows 自己的 test-support 后面。
gpui-pre-platform = { version = "0.3.9", features = ["test-support"] }

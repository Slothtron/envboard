[package]
name = "envboard-engine"
description = "envboard 引擎库：引擎接缝与共享词汇、hosts 规则、领域纯逻辑、进程内代理引擎本体"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 本仓不发布 crate：发布物是 `envboard` 二进制。
publish = false

[[bin]]
name = "render_fixture"
path = "src/bin/render_fixture.rs"

[dependencies]
async-trait.workspace = true
envboard-events.workspace = true
envboard-protocol.workspace = true
arc-swap.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt", "net", "sync", "io-util"] }
tokio-rustls.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }

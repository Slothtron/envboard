[package]
name = "envboard-server"
description = "envboard 工作台：本地 HTTP API + 内嵌前端（零前端构建、零 CDN）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "envboard"
path = "src/main.rs"

[dependencies]
envboard-engine.workspace = true
clap.workspace = true
envboard-manager.workspace = true
axum = { workspace = true, features = ["json", "query"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "time", "sync", "macros"] }
tokio-stream.workspace = true
qrcode.workspace = true

[dev-dependencies]
envboard-engine-fake.workspace = true
libc.workspace = true

[package]
name = "envboard-server"
description = "envboard 宿主：唯一二进制 `envboard` 的组合根（引擎装配 + 管理器 + web 工作台）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "envboard"
path = "src/main.rs"

[dependencies]
envboard-admin.workspace = true
envboard-engine.workspace = true
envboard-manager.workspace = true
envboard-web.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }

# envboard-nsh —— NSH 0.6.1 的壳。lib 给 golden 挂测试，bin 是起窗的那一版。
#
# 数据面只在 `service.rs` 里出现：`pages` / `shell` 认的是 `model::Env` 与 `actions::Ctx`，
# 所以管理门面、组合根、协议词汇这三个依赖**不许**漏到界面代码里（D-2）。
[package]
name = "envboard-nsh"
description = "envboard 的 NSH 0.6.1 交付形态（迁移中）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
envboard-ui.workspace = true
nsh-base.workspace = true
nsh-core.workspace = true
# 数据面（M3 起）：组合根 + 管理门面 + 协议词汇 + 错误信封。
envboard-host.workspace = true
envboard-admin.workspace = true
envboard-protocol.workspace = true
envboard-engine.workspace = true
# 宿主要自己的 tokio 运行时（`prepare().startup()` 得在 tokio 上下文里 await）。
tokio.workspace = true
serde_json.workspace = true
# 起窗日志（`RUST_LOG=info` 看平台层与宿主编排）。0.11 与样板同版本，离线缓存已暖。
env_logger = "0.11"
log = "0.4"

# 平台层只在 Windows 上存在；`default-features = false` 是不带 webview 的那套。
# 注意：这条**不能**提升到 workspace.dependencies —— 那里不支持 target 条件表。
[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.6.1", default-features = false }

# 把 assets/app.rc 的 1 号图标编进 exe：NSH 优先用 exe 自带图标（LoadIconW(instance,1)），
# 内嵌之后标题栏 / 任务栏 / Alt+Tab / 资源管理器才是同一枚图。
[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
# golden 基线存 PNG（4.4 MB/张的裸 BGRA 不进库）。纯 Rust，离线缓存已暖。
png = "0.17"

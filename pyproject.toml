[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 命名分层（详见 README.md「命名模型」）：
#   PyPI 分发名 = slothtron-envboard  ← slothtron 只出现在这一行
#   导入包名   = envboard            ← 目录 src/envboard，代码里不出现 slothtron
[project]
name = "slothtron-envboard"
version = "0.1.0"
description = "mitmproxy multi-environment DNS workbench: per-env DNS servers, host/ip mapping, switchable environments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mitmproxy", "addon", "dns", "environment", "dashboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
]
# mitmproxy_rs 提供 Rust 侧 DNS（hickory）解析器；它是 mitmproxy 的传递依赖，
# 这里显式声明，因为本插件直接依赖它的 DnsResolver / get_system_dns_servers。
dependencies = [
  "mitmproxy>=12.2,<14",
  "mitmproxy_rs>=0.12.6,<0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/envboard"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/addons",
  "/core/spec",
  "/docs",
  "/scripts",
  "/ci",
  "/tests",
  "/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]

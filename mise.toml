# 工具版本锁定 + 跨平台任务入口。`mise run` / `mise run <task>` 即用。
# rust 不在此管理：由 rust-toolchain.toml（rustup）钉死，避免双头。
# 任务 recipe 一律单命令、不用 `&&`，sh 与 PowerShell 均可直接执行（Windows 原生可用）。
#
# 这里**没有**前端工具链：web 形态（SPA + HTTP 宿主）已整体出库，本仓只剩 Rust
# 与 Python 编排（scripts/verify.py 验证、scripts/package.py 打绿色包）。
# 想把它带回来，先读 docs/adr-003。

[tools]
python = "3.14.7"

[tasks.test]
description = "Rust 全量测试（参数透传给 cargo）"
raw = true
run = "cargo test"

[tasks.verify]
description = "全量验证门禁（分层参数透传：all/policy/rust/contract/live）"
raw = true
run = "python scripts/verify.py"

[tasks.desktop]
description = "跑工作台（GPUI 桌面形态，进程内直连组合根，不起 HTTP）"
run = "cargo run -p envboard-desktop --bin envboard"

[tasks.verify-desktop]
description = "桌面形态的编译 + 单测（纯逻辑 + 实体级；无头 UI 测试的边界见 docs/adr-001）"
run = "cargo test -p envboard-desktop"

[tasks.package]
description = "打包唯一发布物：桌面 GUI 二进制 envboard"
run = "cargo build --release"

[tasks.package-portable]
description = "绿色免安装压缩包（exe + 便携标记 + 说明；产物在 dist/）"
run = "python scripts/package.py"
